name: Check ACP upstream

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check native runtimes and upstream adapters
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/check-acp-upstream.mjs
